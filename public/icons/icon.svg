<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS App Icon Rounded Rect Base -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Subtle grid rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#475569" stroke-width="2" opacity="0.5" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#64748B" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="210" fill="url(#radarGlow)" />

  <!-- Radar sweep line -->
  <path d="M 256 256 L 380 132 A 175 175 0 0 0 256 81 Z" fill="url(#glow)" opacity="0.25" />

  <!-- Center Core Icon: Tech Lightning & Spark -->
  <path d="M268 140 L200 268 L248 268 L240 372 L312 244 L264 244 Z" fill="url(#glow)" filter="url(#neon)" />

  <!-- Orbiting dots -->
  <circle cx="360" cy="180" r="8" fill="#00F0FF" filter="url(#neon)" />
  <circle cx="160" cy="340" r="6" fill="#FF007A" filter="url(#neon)" />
  <circle cx="330" cy="350" r="7" fill="#7000FF" filter="url(#neon)" />
</svg>
